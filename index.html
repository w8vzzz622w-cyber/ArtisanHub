<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArtisanHub</title><meta name="theme-color" content="#14213D">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213D;--paper:#FAFAF7;--line:#E2E4DC;--mute:#5B6475;--sun:#F5B700;--ok:#1F8A5B;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{background:var(--ink);color:#fff;padding-top:env(safe-area-inset-top)}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif}.logo i{font-style:normal;color:var(--sun)}
nav button{background:none;border:0;color:#cfd5e4;font:600 15px Figtree,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer}
nav button.on{color:var(--ink);background:var(--sun)}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.btn{display:inline-block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 16px Figtree,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.btn.sun{background:var(--sun);color:var(--ink)}.btn.sm{width:auto;margin:0;padding:9px 14px;font-size:14px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.who{display:flex;gap:12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;background:var(--line);object-fit:cover;display:grid;place-items:center;font:800 22px 'Bricolage Grotesque';flex:none}
.chip{display:inline-block;background:#FFF3CC;border-radius:99px;padding:3px 10px;font-size:13px;margin:6px 6px 0 0}
.chip b{cursor:pointer;margin-left:6px}
.tag{font-size:13px;font-weight:600}.tag.v{color:var(--ok)}.tag.p{color:var(--mute)}
.mute{color:var(--mute);font-size:14px}.hide{display:none!important}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:4px}
.tabs button{flex:1;background:none;border:0;padding:12px;font:600 16px Figtree,sans-serif;color:var(--mute);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--sun)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:auto;padding:13px 16px;border-radius:10px;background:var(--ink);color:#fff;z-index:9}
#toast.err{background:var(--bad)}
</style></head><body>

<section id="auth" class="wrap">
  <h1 class="logo" style="font-size:34px;margin:28px 0 6px">Artisan<i>Hub</i></h1>
  <p class="mute" style="margin:0 0 18px">Find skilled people near you, or get found for the work you do.</p>
  <div class="tabs"><button id="tLogin" class="on">Log in</button><button id="tSign">Create account</button></div>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Password (at least 6 characters)</label><input id="pw" type="password" autocomplete="current-password">
  <button id="authBtn" class="btn">Log in</button>
</section>

<div id="app" class="hide">
<header><div class="wrap"><span class="logo">Artisan<i>Hub</i></span>
<nav><button id="nFind" class="on">Find</button><button id="nMe">My profile</button><button id="nOut">Log out</button></nav></div></header>

<main class="wrap">
<section id="find">
  <h2 style="margin:6px 0 4px">Who do you need?</h2>
  <label for="fCat">Type of work</label><select id="fCat"><option value="">Any type of work</option></select>
  <label for="fArea">Area or town</label><input id="fArea" placeholder="e.g. Ikeja, Wuse, Rumuokoro">
  <button id="fGo" class="btn sun">Search</button>
  <div id="results"></div>
</section>

<section id="me" class="hide">
  <h2 style="margin:6px 0 4px">My profile</h2>
  <p id="meNote" class="mute" style="margin:0">Complete this to appear in search. Your full address stays private.</p>
  <div class="who" style="margin-top:14px"><div id="mAv" class="av">?</div>
    <div style="flex:1"><label for="mPhoto" style="margin:0 0 4px">Profile photo (a clear picture of your face)</label><input id="mPhoto" type="file" accept="image/*"></div></div>
  <label for="mName">Full real name</label><input id="mName" autocomplete="name">
  <div class="row"><div><label for="mUser">Username</label><input id="mUser" autocapitalize="none" placeholder="e.g. tunde_paints"></div>
  <div><label for="mAge">Age (18+)</label><input id="mAge" type="number" min="18" max="90" inputmode="numeric"></div></div>
  <label for="mPhone">Phone number</label><input id="mPhone" type="tel" placeholder="08012345678">
  <div class="row"><div><label for="mState">State</label><input id="mState" placeholder="e.g. Lagos"></div>
  <div><label for="mArea">Area or town</label><input id="mArea" placeholder="e.g. Ikeja"></div></div>
  <label for="mAddr">Home address (private, never shown to others)</label><input id="mAddr" autocomplete="street-address">
  <label for="mBio">About your work</label><textarea id="mBio" rows="3" maxlength="300" placeholder="What you do, how long you have done it"></textarea>
  <label for="mCat">Skills you offer</label>
  <div class="row"><select id="mCat" style="flex:3"></select><button id="mAdd" class="btn sm ghost" type="button">Add</button></div>
  <input id="mOther" class="hide" placeholder="Type your own skill" style="margin-top:8px">
  <div id="mSkills"></div>
  <button id="mSave" class="btn sun">Save profile</button>
</section>
</main></div>
<div id="toast" class="hide" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://ndykkrxdreznzzubqgwd.supabase.co','sb_publishable_2-u9poN8TG2Yi6UWVxhXQg_2937clXk');
const $=id=>document.getElementById(id);
let uid=null,cats=[],skills=[],hasProfile=false,photoUrl=null,signup=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,err){const t=$('toast');t.textContent=m;t.className=err?'err':'';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='hide',4500)}
const wa=n=>{n=String(n).replace(/\D/g,'');return n.startsWith('0')?'234'+n.slice(1):n};

/* ---- sign in / sign up ---- */
function mode(s){signup=s;$('tSign').className=s?'on':'';$('tLogin').className=s?'':'on';$('authBtn').textContent=s?'Create account':'Log in'}
$('tLogin').onclick=()=>mode(false);$('tSign').onclick=()=>mode(true);
$('authBtn').onclick=async()=>{
  const email=$('em').value.trim(),password=$('pw').value;
  if(!email||password.length<6)return toast('Enter your email and a password of at least 6 characters.',1);
  $('authBtn').disabled=true;
  const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  $('authBtn').disabled=false;
  if(r.error)return toast(r.error.message,1);
  if(!r.data.session)return toast('Check your email to confirm your account, then log in.');
  start(r.data.session.user)};
$('nOut').onclick=async()=>{await sb.auth.signOut();location.reload()};

/* ---- screens ---- */
function view(v){$('find').classList.toggle('hide',v!=='find');$('me').classList.toggle('hide',v!=='me');
  $('nFind').className=v==='find'?'on':'';$('nMe').className=v==='me'?'on':'';scrollTo(0,0)}
$('nFind').onclick=()=>{view('find');search()};$('nMe').onclick=()=>view('me');

async function start(user){
  uid=user.id;$('auth').classList.add('hide');$('app').classList.remove('hide');
  const c=await sb.from('categories').select('id,group_name,name').order('id');
  if(c.error)return toast('Could not load job types. Check your internet.',1);
  cats=c.data;
  const groups=[...new Set(cats.map(x=>x.group_name))];
  const opts=groups.map(g=>`<optgroup label="${esc(g)}">`+cats.filter(x=>x.group_name===g).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')+'</optgroup>').join('');
  $('fCat').innerHTML='<option value="">Any type of work</option>'+opts;$('mCat').innerHTML=opts;
  $('mCat').onchange=()=>$('mOther').classList.toggle('hide',!isOther($('mCat').value));
  $('mCat').onchange();
  const [p,pd,sk]=await Promise.all([
    sb.from('profiles').select('*').eq('id',uid).maybeSingle(),
    sb.from('private_details').select('home_address').eq('user_id',uid).maybeSingle(),
    sb.from('profile_skills').select('category_id,other_text').eq('profile_id',uid)]);
  if(p.data){hasProfile=true;const d=p.data;
    $('mName').value=d.full_name;$('mUser').value=d.username;$('mAge').value=d.age;$('mPhone').value=d.phone;
    $('mState').value=d.state||'';$('mArea').value=d.area;$('mBio').value=d.bio||'';photoUrl=d.avatar_url;paintAv();
    $('meNote').textContent='Verification status: '+(d.verification_status==='verified'?'Verified':'Pending. ID verification is coming soon.')}
  if(pd.data)$('mAddr').value=pd.data.home_address;
  skills=(sk.data||[]).map(s=>({category_id:s.category_id,other_text:s.other_text}));paintSkills();
  if(hasProfile){view('find');search()}else{view('me');toast('Welcome! Complete your profile to get started.')}}

/* ---- profile ---- */
const isOther=id=>(cats.find(c=>c.id==id)||{}).group_name==='Other';
const catName=s=>s.other_text||(cats.find(c=>c.id==s.category_id)||{}).name||'';
function paintAv(){const a=$('mAv');a.innerHTML=photoUrl?`<img class="av" src="${esc(photoUrl)}" alt="">`:esc(($('mName').value||'?')[0].toUpperCase())}
function paintSkills(){$('mSkills').innerHTML=skills.map((s,i)=>`<span class="chip">${esc(catName(s))}<b data-i="${i}" role="button" aria-label="Remove">×</b></span>`).join('')||'<p class="mute">No skills added yet.</p>';
  document.querySelectorAll('#mSkills b').forEach(b=>b.onclick=()=>{skills.splice(+b.dataset.i,1);paintSkills()})}
$('mPhoto').onchange=()=>{const f=$('mPhoto').files[0];if(f)$('mAv').innerHTML=`<img class="av" src="${URL.createObjectURL(f)}" alt="">`};
$('mAdd').onclick=()=>{const id=+$('mCat').value;if(skills.some(s=>s.category_id===id))return toast('You already added that skill.',1);
  let o=null;if(isOther(id)){o=$('mOther').value.trim();if(!o)return toast('Type your skill first.',1)}
  skills.push({category_id:id,other_text:o});$('mOther').value='';paintSkills()};

function shrink(file){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  c.toBlob(b=>b?ok(b):no(),'image/jpeg',.8)};im.onerror=no;im.src=URL.createObjectURL(file)})}

$('mSave').onclick=async()=>{
  const v={full_name:$('mName').value.trim(),username:$('mUser').value.trim().toLowerCase(),age:+$('mAge').value,
    phone:$('mPhone').value.trim(),state:$('mState').value.trim(),area:$('mArea').value.trim(),bio:$('mBio').value.trim()};
  const addr=$('mAddr').value.trim();
  if(v.full_name.split(/\s+/).length<2)return toast('Enter your full real name (first and last).',1);
  if(!/^[a-z0-9_]{3,20}$/.test(v.username))return toast('Username: 3 to 20 letters, numbers or underscores.',1);
  if(!(v.age>=18))return toast('You must be 18 or older.',1);
  if(!/^\+?\d{10,15}$/.test(v.phone.replace(/\s/g,'')))return toast('Enter a valid phone number.',1);
  if(!v.area||!addr)return toast('Add your area and home address.',1);
  if(!skills.length)return toast('Add at least one skill.',1);
  if(!photoUrl&&!$('mPhoto').files[0])return toast('Upload a clear photo of your face.',1);
  $('mSave').disabled=true;let step='photo';
  try{
    const f=$('mPhoto').files[0];
    if(f){const b=await shrink(f),path=uid+'/avatar.jpg';
      const u=await sb.storage.from('avatars').upload(path,b,{upsert:true,contentType:'image/jpeg'});
      if(u.error)throw u.error;photoUrl=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?t='+Date.now()}
    v.avatar_url=photoUrl;
    step='profile';const w=hasProfile?await sb.from('profiles').update(v).eq('id',uid):await sb.from('profiles').insert({id:uid,...v});
    if(w.error)throw w.error;hasProfile=true;
    step='address';const a=await sb.from('private_details').upsert({user_id:uid,home_address:addr});if(a.error)throw a.error;
    step='skills';const d=await sb.from('profile_skills').delete().eq('profile_id',uid);if(d.error)throw d.error;
    const s=await sb.from('profile_skills').insert(skills.map(x=>({profile_id:uid,...x})));if(s.error)throw s.error;
    paintAv();toast('Profile saved.');view('find');search();
  }catch(e){toast(e.code==='23505'?'That username is taken. Try another.':'Could not save ('+step+'): '+(e.message||'try again'),1)}
  $('mSave').disabled=false};

/* ---- search ---- */
async function search(){
  const box=$('results');box.innerHTML='<p class="mute">Searching…</p>';
  let ids=null;const cat=$('fCat').value;
  if(cat){const r=await sb.from('profile_skills').select('profile_id').eq('category_id',cat);
    if(r.error)return box.innerHTML='<p class="mute">Search failed. Try again.</p>';ids=r.data.map(x=>x.profile_id)}
  if(ids&&!ids.length)return box.innerHTML='<div class="card">Nobody is listed for this work yet. Try another area or type.</div>';
  let q=sb.from('profiles').select('id,full_name,username,age,phone,state,area,bio,avatar_url,verification_status,profile_skills(other_text,categories(name))').limit(50);
  if(ids)q=q.in('id',ids);
  const ar=$('fArea').value.trim().replace(/[%,()]/g,'');if(ar)q=q.or(`area.ilike.%${ar}%,state.ilike.%${ar}%`);
  const r=await q;if(r.error)return box.innerHTML='<p class="mute">Search failed. Try again.</p>';
  if(!r.data.length)return box.innerHTML='<div class="card">No results. Try a different area or type of work.</div>';
  box.innerHTML=r.data.map(p=>{const sk=(p.profile_skills||[]).map(s=>`<span class="chip">${esc(s.other_text||(s.categories||{}).name)}</span>`).join('');
    const ver=p.verification_status==='verified';
    return `<div class="card"><div class="who">${p.avatar_url?`<img class="av" src="${esc(p.avatar_url)}" alt="">`:`<div class="av">${esc(p.full_name[0])}</div>`}
    <div><h3>${esc(p.full_name)}</h3><div class="mute">${esc(p.age)} yrs · ${esc(p.area)}${p.state?', '+esc(p.state):''}</div>
    <span class="tag ${ver?'v':'p'}">${ver?'✓ Verified':'Verification pending'}</span></div></div>
    <div>${sk}</div>${p.bio?`<p style="margin:10px 0 0">${esc(p.bio)}</p>`:''}
    <div class="row" style="margin-top:12px"><a class="btn sm" href="tel:${esc(p.phone.replace(/\s/g,''))}">Call</a>
    <a class="btn sm sun" target="_blank" rel="noopener" href="https://wa.me/${wa(p.phone)}">WhatsApp</a></div></div>`}).join('')}
$('fGo').onclick=search;

sb.auth.getSession().then(({data})=>{if(data.session)start(data.session.user)});
</script></body></html>
