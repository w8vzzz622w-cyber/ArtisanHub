<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ArtisanHub NG – Back in a minute</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3F0E8;color:#14213D;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
.box{max-width:420px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.5px}
h1 span{color:#C9A24B}
.dot{width:54px;height:54px;border-radius:50%;margin:0 auto 18px;border:5px solid #E6CF8B;border-top-color:#14213D;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
p{line-height:1.5;color:#4a5470;margin:10px 0}
a.btn{display:inline-block;margin-top:14px;background:#14213D;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;font-weight:600}
small{display:block;margin-top:22px;color:#8a90a5}
</style>
</head>
<body>
<div class="box">
  <div class="dot"></div>
  <h1>Artisan<span>Hub</span> NG</h1>
  <p><b>We are making an update.</b></p>
  <p>The site will be back in a minute. This page will try again by itself.</p>
  <a class="btn" href="/">Try again now</a>
  <small>If you typed the link by hand, tap the button to go to the home page.</small>
</div>
<script>setTimeout(function(){location.href='/'},20000)</script>
</body>
</html>
